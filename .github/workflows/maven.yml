name: Java CI with Maven

# Un cambio que toca solo el frontend no necesita compilar ni testear Java (de eso se ocupa frontend.yml),
# y uno que toca solo documentación (README, docs/) tampoco.
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/e2e.yml"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/e2e.yml"
      - "docs/**"
      - "**.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Java 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    # verify = package + reporte de cobertura + piso mínimo (JaCoCo, ver pom.xml).
    - name: Build, test and check coverage
      run: mvn -B verify --file pom.xml

    # El reporte HTML queda descargable desde la página de la corrida (Summary → Artifacts), también si
    # falla el piso de cobertura: ahí se ve qué líneas quedaron sin tests. (Si fallan los tests, no hay
    # reporte: Maven corta antes de verify.)
    - name: Upload coverage report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: target/site/jacoco/
        retention-days: 7
