name: E2E

# El recorrido login → venta → historial cruza frontend Y backend: un cambio en cualquiera de los dos
# puede romperlo. No corre por tests de Java (src/test) ni por documentación: no cambian la app.
on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"
      - "src/main/**"
      - "pom.xml"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "frontend/**"
      - "src/main/**"
      - "pom.xml"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Si algo se cuelga (un servidor que nunca arranca), se corta a los 15 minutos y no a las 6 horas.
    timeout-minutes: 15

    # Postgres descartable: nace vacío en cada corrida y desaparece al terminar. Se publica en el 5433,
    # el mismo puerto que en local, así playwright.config.ts funciona sin cambios.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kiosco_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Descarga las dependencias y compila antes: así el arranque del backend dentro de Playwright
      # no gasta su tiempo de espera bajando medio Internet.
      - name: Compile backend
        working-directory: .
        run: ./mvnw -B -q -DskipTests compile

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Playwright levanta el backend (8081) y el frontend (3100) solo, corre el test y los apaga.
      - name: Run end-to-end tests
        run: npm run e2e

      # Si falla, la captura y la grabación (trace.zip) quedan para descargar desde la página del run.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
