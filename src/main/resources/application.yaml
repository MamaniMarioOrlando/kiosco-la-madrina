# Configuración base = PRODUCCIÓN (seguro por defecto). Así corre el .jar en Railway, sin perfiles.
# Las herramientas de desarrollo están en application-dev.yaml y requieren activar el perfil "dev"
# (./mvnw spring-boot:run lo activa solo). Si alguien se olvida de activarlo, nada queda expuesto.
spring:
  application:
    name: kioscoLaMadrina
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Evita el problema N+1: al cargar relaciones lazy (los ítems de cada venta, sus productos) Hibernate
        # las trae para hasta 50 entidades juntas con un IN (...), en vez de una consulta por cada una.
        default_batch_fetch_size: 50
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  # En Railway las conexiones llegan a través de su proxy, que informa la IP del cliente en X-Forwarded-For.
  # "native" (RemoteIpValve de Tomcat) lee ese encabezado de derecha a izquierda, salteando solo proxies de
  # confianza (redes internas): la IP que agrega el proxy gana y lo que invente el cliente a la izquierda se
  # ignora. NO usar "framework": toma la IP de más a la izquierda, que el cliente puede falsificar.
  forward-headers-strategy: native
  # Por defecto solo se confía en proxies de redes privadas (10.x, 192.168.x, 127.x, ::1...). En Railway
  # los proxies tienen IPs públicas, así que ahí se configura SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES=.*
  # Es seguro solo en Railway, y se verificó en producción (2026-10-16): el contenedor solo es accesible
  # a través de su proxy, y el proxy reemplaza X-Forwarded-For con la IP real (descarta lo que mande el cliente).
  # Diagnóstico: LOGGING_LEVEL_KIOSCO_CLIENTIP=DEBUG muestra qué IP ve la app (ClientIpLoggingFilter).

# La documentación interactiva de la API (Swagger) es un mapa completo de rutas y campos:
# solo se publica en desarrollo.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

kiosco:
  app:
    jwtSecret: ${JWT_SECRET_KEY:}
    # Un turno de trabajo con margen: el empleado se loguea una vez por turno y una sesión
    # olvidada en la PC del kiosco se cierra sola. Configurable sin tocar código (p. ej. 8h, 30m).
    jwtExpiration: ${JWT_EXPIRATION:12h}
    # Zona del negocio: define qué ventas entran en "el día" (00:00 a 23:59 de Argentina).
    timeZone: ${KIOSCO_TIME_ZONE:America/Argentina/Buenos_Aires}
  bootstrap:
    admin:
      username: ${ADMIN_USERNAME:}
      password: ${ADMIN_PASSWORD:}
      email: ${ADMIN_EMAIL:admin@kiosco.local}
