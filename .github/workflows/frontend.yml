name: Frontend CI

# Solo corre cuando cambia el frontend (o este mismo archivo): un PR que toca únicamente Java
# no gasta minutos de CI compilando Next.js.
on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

# Si se suben dos commits seguidos al mismo PR, se cancela la corrida vieja: solo importa la última.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: el workflow solo necesita leer el código.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci instala exactamente lo que dice package-lock.json (y falla si no coincide con package.json).
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
