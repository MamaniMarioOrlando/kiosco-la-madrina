name: Java CI with Maven

# Un cambio que toca solo el frontend no necesita compilar ni testear Java (de eso se ocupa frontend.yml).
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/e2e.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Java 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build and run Integration Tests
      run: mvn -B package --file pom.xml
